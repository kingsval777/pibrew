<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.Pi Brew | Cyber Cafe</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ff; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .nexus { border: 2px solid var(--neon); padding: 25px; text-align: center; box-shadow: 0 0 15px var(--neon); }
        .status { color: var(--neon); font-size: 0.8rem; margin: 15px 0; border: 1px solid #333; padding: 5px; }
        button { background: transparent; border: 2px solid var(--pink); color: var(--pink); padding: 12px 24px; cursor: pointer; box-shadow: 0 0 10px var(--pink); }
    </style>
</head>
<body>

<div class="nexus">
    <h1>.PI BREW</h1>
    <div class="status" id="status">INIT...</div>
    <div id="auth-box">
        <button onclick="login()">LOG IN</button>
    </div>
    <div id="pay-box" style="display:none;">
        <button onclick="pay()">SEND 0.01 TEST-PI</button>
    </div>
</div>

<script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    async function login() {
        try {
            const auth = await Pi.authenticate(['username', 'payments'], onIncomplete);
            document.getElementById('status').innerText = `USER: ${auth.user.username}`;
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('pay-box').style.display = 'block';
        } catch (e) { document.getElementById('status').innerText = "AUTH FAIL"; }
    }

    async function pay() {
        document.getElementById('status').innerText = "OPENING WALLET...";
        Pi.createPayment({
            amount: 0.01,
            memo: "Step 10 Test",
            metadata: { orderId: "123" }
        }, {
            onReadyForServerApproval: (paymentId) => {
                document.getElementById('status').innerText = "APPROVING...";
                fetch('/api/approve', { method: 'POST', body: JSON.stringify({ paymentId }) });
            },
            onReadyForServerCompletion: (paymentId, txid) => {
                document.getElementById('status').innerText = "COMPLETING...";
                fetch('/api/complete', { method: 'POST', body: JSON.stringify({ paymentId, txid }) })
                .then(() => { document.getElementById('status').innerText = "VERIFIED!"; });
            },
            onCancel: () => { document.getElementById('status').innerText = "CANCELLED"; },
            onError: (e) => { document.getElementById('status').innerText = "ERROR"; }
        });
    }

    function onIncomplete(p) { console.log("Incomplete found", p); }
</script>
</body>
</html>
