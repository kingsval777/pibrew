<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.Pi Brew | Cyber Cafe</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ff; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .nexus { border: 2px solid var(--neon); padding: 20px; box-shadow: 0 0 15px var(--neon); text-align: center; width: 90%; }
        #logs { font-size: 10px; color: #888; margin-top: 20px; text-align: left; background: #111; padding: 10px; width: 100%; overflow-y: auto; height: 100px; }
        button { background: transparent; border: 2px solid var(--pink); color: var(--pink); padding: 12px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="nexus">
    <h1>.PI BREW</h1>
    <div id="status" style="color:var(--neon)">SYSTEM READY</div>
    
    <div id="auth-box"><button onclick="login()">1. AUTHENTICATE</button></div>
    <div id="pay-box" style="display:none;"><button onclick="pay()">2. PAY 0.01 TEST-PI</button></div>

    <div id="logs">LOGS:<br></div>
</div>

<script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    function log(msg) {
        document.getElementById('logs').innerHTML += "> " + msg + "<br>";
    }

    async function login() {
        log("Attempting Login...");
        try {
            const auth = await Pi.authenticate(['username', 'payments'], (p) => log("Incomplete Payment: " + p.identifier));
            log("User: " + auth.user.username);
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('pay-box').style.display = 'block';
        } catch (e) { log("Auth Error: " + e); }
    }

    async function pay() {
        log("Creating Payment...");
        Pi.createPayment({
            amount: 0.01,
            memo: "Step 10 Pass",
            metadata: { orderId: "ID-" + Date.now() }
        }, {
            onReadyForServerApproval: (pid) => {
                log("Server Approval Requested...");
                fetch('/api/approve', { method: 'POST', body: JSON.stringify({ pid }) })
                .then(r => r.json()).then(data => log("Server Approved: " + data.action));
            },
            onReadyForServerCompletion: (pid, txid) => {
                log("Payment signed! Completing...");
                fetch('/api/complete', { method: 'POST', body: JSON.stringify({ pid, txid }) })
                .then(() => log("COMPLETE! REFRESH CHECKLIST"));
            },
            onCancel: () => log("User Cancelled"),
            onError: (e) => log("Error: " + e.message)
        });
    }
</script>
</body>
</html>
