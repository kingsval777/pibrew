<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.Pi Brew | Cyber Cafe</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00ff; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .nexus { border: 2px solid var(--neon); padding: 30px; border-radius: 10px; box-shadow: 0 0 20px var(--neon); text-align: center; background: rgba(0,0,0,0.9); }
        .status { color: var(--neon); margin: 15px 0; padding: 10px; border: 1px solid #333; font-size: 0.9rem; }
        button { background: transparent; border: 2px solid var(--pink); color: var(--pink); padding: 15px 30px; cursor: pointer; font-weight: bold; box-shadow: 0 0 10px var(--pink); }
        button:disabled { border-color: #444; color: #444; box-shadow: none; }
    </style>
</head>
<body>

<div class="nexus">
    <h1>.PI BREW</h1>
    <p style="color:var(--neon)">1 PI = $314,159</p>
    <div class="status" id="status">WAITING...</div>
    
    <div id="auth-box"><button onclick="login()">INITIALIZE ACCESS</button></div>
    <div id="pay-box" style="display:none;"><button id="pay-btn" onclick="pay()">PAY 0.01 TEST-PI</button></div>
</div>

<script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    async function login() {
        try {
            const auth = await Pi.authenticate(['username', 'payments'], onIncomplete);
            document.getElementById('status').innerText = `IDENTIFIED: ${auth.user.username}`;
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('pay-box').style.display = 'block';
        } catch (e) { document.getElementById('status').innerText = "ERROR: USE PI BROWSER"; }
    }

    async function pay() {
        const btn = document.getElementById('pay-btn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.innerText = "OPENING WALLET...";

        Pi.createPayment({
            amount: 0.01,
            memo: "Step 10 Final Pass",
            metadata: { orderId: "pibrew_" + Date.now() }
        }, {
            onReadyForServerApproval: (paymentId) => {
                status.innerText = "SERVER APPROVING...";
                fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId })
                });
            },
            onReadyForServerCompletion: (paymentId, txid) => {
                status.innerText = "COMPLETING...";
                fetch('/api/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentId, txid })
                }).then(() => {
                    status.innerText = "SUCCESS! REFRESH STEP 10.";
                });
            },
            onCancel: () => { status.innerText = "CANCELLED"; btn.disabled = false; },
            onError: (e) => { status.innerText = "PAYMENT ERROR"; btn.disabled = false; }
        });
    }

    function onIncomplete(p) { console.log(p); }
</script>
</body>
</html>
